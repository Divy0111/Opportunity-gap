<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Portal Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url("view.jpeg");
            /* background: linear-gradient(
                135deg,
                #4c1d95,
                #7c3aed,
                #a78bfa
            ); */
        }


        /* LOGIN BOX */

        .login-box {
            width: 380px;

            background: white;
            /* opacity: 70%; */
            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);
        }


        /* LOGO / TITLE */

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #5b21b6;

            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }


        /* LABEL */

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }


        /* INPUT */

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        input:focus {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 2px #ede9fe;
        }


        /* PASSWORD AREA */

        .password-container {
            position: relative;
        }


        .password-container input {
            padding-right: 70px;
        }


        .show-password {
            position: absolute;

            right: 10px;

            top: 12px;

            border: none;

            background: none;

            color: #5b21b6;

            cursor: pointer;

            font-weight: bold;
        }


        /* LOGIN BUTTON */

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #5b21b6;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-btn:hover {
            background: #4c1d95;
        }


        /* MESSAGE */

        #message {
            text-align: center;

            margin-top: 20px;

            font-weight: bold;
        }


        .success {
            color: #16a34a;
        }


        .error {
            color: #dc2626;
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .login-box {
                width: 90%;

                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <div class="login-box">

        <div class="logo">
            Opportune
        </div>

        <p class="subtitle">
            Student Opportunity Portal
        </p>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label for="password">
                Password
            </label>


            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="showPassword">
                    Show
                </button>

            </div>


            <button
                type="submit"
                class="login-btn">
                Login
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script>

        /* LOGIN FORM */

        const loginForm =
            document.getElementById("loginForm");


        const username =
            document.getElementById("username");


        const password =
            document.getElementById("password");


        const message =
            document.getElementById("message");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                /*
                    LOGIN DETAILS
                */

                const correctUsername = "Divy";

                const correctPassword = "Divy01";


                /*
                    CHECK USERNAME
                    AND PASSWORD
                */

                if (
                    username.value === correctUsername &&
                    password.value === correctPassword
                ) {

                    // message.textContent =
                    //     "Login successful! Welcome, Divy.";

                    // message.className =
                    //     "success";


                    /*
                        You can redirect
                        to your main website here.

                        Example:
                        */

                        window.location.href =
                            "home.html";
                

                }

                else {

                    message.textContent =
                        "Invalid username or password.";

                    message.className =
                        "error";

                }

            }
        );


        /* SHOW / HIDE PASSWORD */

        const showPassword =
            document.getElementById("showPassword");


        showPassword.addEventListener(
            "click",
            function() {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    showPassword.textContent =
                        "Hide";

                }

                else {

                    password.type = "password";

                    showPassword.textContent =
                        "Show";

                }

            }
        );

    </script>

</body>

</html>
